name: Publicar Cierre Concierge Tango

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar main
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar PWA estática
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest service-worker.js supabase-config.js icon-192.png icon-512.png _site/
          touch _site/.nojekyll

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
